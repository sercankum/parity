# Tests on real Windows, macOS and Linux, then builds a standalone app for each.
# Push a tag like v1.0.0 to publish a GitHub Release with all three downloads.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Parity-windows-x64.zip
          - os: macos-latest
            artifact: Parity-macos-arm64.zip
          - os: ubuntu-22.04          # older glibc, so the binary runs on most distros
            artifact: Parity-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - name: Test (includes a real scan of this runner)
        run: python test_parity.py
      - name: Build
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows)
              pyinstaller --noconfirm --onefile --windowed --name Parity main.py
              7z a "${{ matrix.artifact }}" ./dist/Parity.exe ;;
            macOS)
              pyinstaller --noconfirm --windowed --name Parity main.py
              ditto -c -k --keepParent dist/Parity.app "${{ matrix.artifact }}" ;;
            Linux)
              pyinstaller --noconfirm --onefile --name Parity main.py
              tar -czf "${{ matrix.artifact }}" -C dist Parity ;;
          esac
      - name: Install desktop graphics libraries (Linux desktops already have these)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libxkbcommon0 libfontconfig1
      - name: Launch the built app (demo scan, then quit)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          case "$RUNNER_OS" in
            Windows) app=./dist/Parity.exe ;;
            macOS)   app=./dist/Parity.app/Contents/MacOS/Parity ;;
            Linux)   app=./dist/Parity ;;
          esac
          if ! out=$("$app" --smoke 2>&1); then
            echo "$out"
            echo "::error title=Built app failed on $RUNNER_OS::$(echo "$out" | tail -8 | tr '\n' ' ')"
            exit 1
          fi
          echo "::notice title=Built app on $RUNNER_OS::Opened, ran a demo scan and closed cleanly"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # Tag pushes (v1.2.3) get their own release. Every other build on main updates a
  # rolling "Latest build" release, so there's always something to download.
  release:
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    env:
      TAGGED: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Point the "latest" tag at this commit
        if: env.TAGGED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/latest" -f sha="${{ github.sha }}" -F force=true \
            || gh api "repos/${{ github.repository }}/git/refs" -f ref=refs/tags/latest -f sha="${{ github.sha }}"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAGGED == 'true' && github.ref_name || 'latest' }}
          name: ${{ env.TAGGED == 'true' && github.ref_name || 'Latest build' }}
          body: ${{ env.TAGGED != 'true' && format('Built automatically from {0}.', github.sha) || '' }}
          generate_release_notes: ${{ env.TAGGED == 'true' }}
          files: Parity-*
          overwrite_files: true
          make_latest: true
